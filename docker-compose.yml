name: taxi-project

x-airflow-common: &airflow-common
  build:
    context: ./services/airflow
  image: taxi-airflow:NY_taxi
  container_name: taxi_airflow
  user: "${AIRFLOW_UID:-50000}:0"
  restart: "no"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__TEST_CONNECTION: "Enabled"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: local_airflow_secret_key_for_taxi
    AIRFLOW_CONN_POSTGRES_RAW: "postgresql://${RAW_USER}:${RAW_PASSWORD}@postgres:5432/${RAW_DB}"
    AIRFLOW_CONN_GREENPLUM_DWH: "postgresql://gpadmin:${GP_PASSWORD}@greenplum:5432/${GP_DB}"
    AIRFLOW_CONN_DM_CLICKHOUSE: "clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}"
  volumes:
    - ./services/airflow/dags:/opt/airflow/dags:ro
    - ./services/airflow/data:/opt/airflow/data:ro
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: taxi_postgres
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      RAW_DB: ${RAW_DB}
      RAW_USER: ${RAW_USER}
      RAW_PASSWORD: ${RAW_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      SUPERSET_DB: ${SUPERSET_DB}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: taxi_clickhouse
    restart: "no"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./services/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  greenplum:
    build:
      context: ./services/greenplum
    image: taxi-greenplum-pxf-2seg:NYC_taxi
    container_name: taxi_greenplum
    hostname: greenplum
    stop_grace_period: 120s
    restart: "no"
    environment:
      GREENPLUM_PASSWORD: ${GP_PASSWORD}
      GREENPLUM_DATABASE_NAME: ${GP_DB}
      GREENPLUM_PXF_ENABLE: "true"
      GREENPLUM_GPPERFMON_ENABLE: "false"
      GREENPLUM_DISKQUOTA_ENABLE: "false"
      RAW_DB: ${RAW_DB}
      RAW_USER: ${RAW_USER}
      RAW_PASSWORD: ${RAW_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      PXF_JVM_OPTS_FPP: "-Xms128m -Xmx384m"
    ports:
      - "${GREENPLUM_PORT}:5432"
    volumes:
      - greenplum_data:/data
    shm_size: 1gb
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'source /home/gpadmin/.bashrc && PGPASSWORD=${GP_PASSWORD} psql -h localhost -p 5432 -U gpadmin -d ${GP_DB} -tAc \"select 1\" | grep -q 1'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s

  airflow-init:
    <<: *airflow-common
    container_name: taxi_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER} \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email ${AIRFLOW_ADMIN_EMAIL} \
          --password ${AIRFLOW_ADMIN_PASSWORD} || true
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: taxi_airflow_webserver
    command: webserver
    ports:
      - "${AIRFLOW_PORT}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      greenplum:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  airflow-scheduler:
    <<: *airflow-common
    container_name: taxi_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      greenplum:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  superset-init:
    build:
      context: ./services/superset
    image: taxi-superset:NYC_taxi
    container_name: taxi_superset_init
    restart: "no"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_DATABASE_URI: postgresql+psycopg2://${SUPERSET_DB_USER}:${SUPERSET_DB_PASSWORD}@postgres:5432/${SUPERSET_DB}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    volumes:
      - ./services/superset/pythonpath:/app/pythonpath:ro
      - ./services/superset/scripts:/app/scripts:ro
    command: ["/bin/bash", "/app/scripts/init_superset.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  superset:
    image: taxi-superset:NYC_taxi
    container_name: taxi_superset
    restart: "no"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_DATABASE_URI: postgresql+psycopg2://${SUPERSET_DB_USER}:${SUPERSET_DB_PASSWORD}@postgres:5432/${SUPERSET_DB}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    volumes:
      - ./services/superset/pythonpath:/app/pythonpath:ro
    command: ["/bin/bash", "-lc", "superset run -h 0.0.0.0 -p 8088 --with-threads"]
    ports:
      - "${SUPERSET_PORT}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  postgres_data:
  clickhouse_data:
  greenplum_data:
